<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900"><title>Макет desktop — каталог</title><rect width="1440" height="900" fill="#F5F1E9"/><rect width="1440" height="85" fill="#fffdf9"/><text x="38" y="47" font-family="Caveat,cursive" font-size="40" font-weight="700" fill="#123830">Красивый Белорецк</text><text x="420" y="48" font-family="Arial" font-size="13" fill="#21302B">Туры　Новичкам　Гастро-треккинг　Фестивали　Корпоративным　Размещение　Трансферы　О нас</text><rect x="1220" y="22" width="180" height="42" rx="21" fill="#123830"/><text x="1240" y="48" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Забронировать тур</text><rect y="85" width="1440" height="460" fill="#52786f"/><circle cx="965" cy="160" r="45" fill="#EBA63C"/><path d="M0 330 160 200 310 310 490 150 680 315 870 185 1060 305 1240 180 1440 290V545H0Z" fill="#426b70"/><path d="M0 420 190 300 370 390 560 265 760 400 960 285 1160 390 1320 280 1440 340V545H0Z" fill="#123830"/><text x="60" y="145" font-family="Arial" font-size="11" letter-spacing="3" fill="#F5F1E9">БЕЛОРЕЦКИЙ РАЙОН · ЮЖНЫЙ УРАЛ</text><text x="58" y="255" font-family="Caveat,cursive" font-size="100" font-weight="700" fill="#fff">Красивый</text><text x="58" y="340" font-family="Caveat,cursive" font-size="105" font-weight="700" fill="#fff">Белорецк</text><text x="62" y="385" font-family="Arial" font-size="20" fill="#fff">Настоящие горы. Тёплые люди.</text><text x="62" y="415" font-family="Arial" font-size="20" fill="#fff">Впечатления, которые остаются.</text><rect x="62" y="440" width="185" height="48" rx="24" fill="#EBA63C"/><text x="90" y="469" font-family="Arial" font-size="14" font-weight="bold" fill="#123830">Выбрать тур →</text><rect y="545" width="1440" height="115" fill="#F5F1E9"/><text x="65" y="605" font-family="Arial" font-size="17" font-weight="bold" fill="#123830">Безопасность</text><text x="390" y="605" font-family="Arial" font-size="17" font-weight="bold" fill="#123830">Внимание к каждому</text><text x="