<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844"><title>Макет mobile — форма заявки</title><rect width="390" height="844" fill="#F5F1E9"/><rect width="390" height="70" fill="#fffdf9"/><text x="18" y="40" font-family="Caveat,cursive" font-size="31" font-weight="700" fill="#123830">Красивый Белорецк</text><rect y="70" width="390" height="774" fill="#123830"/><text x="20" y="125" font-family="Arial" font-size="26" font-weight="bold" fill="#fff">Расскажите, что вам</text><text x="20" y="157" font-family="Arial" font-size="26" font-weight="bold" fill="#fff">интересно</text><rect x="14" y="184" width="362" height="630" rx="14" fill="#F5F1E9"/><text x="32" y="225" font-family="Arial" font-size="12" font-weight="bold" fill="#21302B">Имя *</text><rect x="30" y="235" width="330" height="42" rx="7" fill="#fff" stroke="#d8d7ce"/><text x="32" y="310" font-family="Arial" font-size="12" font-weight="bold" fill="#21302B">Телефон или e-mail *</text><rect x="30" y="320" width="330" height="42" rx="7" fill="#fff" stroke="#d8d7ce"/><text x="32" y="395" font-family="Arial" font-size="12" font-weight="bold" fill="#21302B">Направление</text><rect x="30" y="405" width="330" height="42" rx="7" fill="#fff" stroke="#d8d7ce"/><text x="32" y="480" font-family="Arial" font-size="12" font-weight="bold" fill="#21302B">Удобные даты</text><rect x="30" y="490" width="330" height="42" rx="7" fill="#fff" stroke="#d8d7ce"/><text x="32" y="565" font-family="Arial" font-size="12" font-weight="bold" fill="#21302B">Комментарий</text><rect x="30" y="575" width="330" height="42" rx="7" fill="#fff" stroke="#d8d7ce"/><rect x="31" y="670" width="12" height="12" fill="#fff" stroke="#123830"/><text x="51" y="680" font-family="Arial" font-size="10" fill="#21302B">Согласие на обработку данных *</text><rect x="30" y="715" width="330" height="48" rx="24" fill="#EBA63C"/><text x="110" y="744" font-family="Arial" font-size="14" font-weight="bold" fill="#123830">Отправить заявку</text></svg>